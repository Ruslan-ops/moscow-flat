<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>MoscowFlatCollector</title>
<style>
  body { font-family: system-ui, sans-serif; width: 300px; padding: 12px; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; margin: 3px 0; }
  .row span:first-child { color: #666; }
  button { flex: 1; padding: 6px; font-size: 13px; cursor: pointer; }
  .buttons { display: flex; gap: 8px; margin: 10px 0; }
  #startBtn { background: #2e7d32; color: white; border: none; border-radius: 4px; }
  #stopBtn { background: #c62828; color: white; border: none; border-radius: 4px; }
  #error { color: #c62828; margin-top: 8px; word-break: break-word; }
  #lastEvent { color: #666; margin-top: 4px; word-break: break-word; font-size: 12px; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 11px; }
  .badge.running { background: #e8f5e9; color: #2e7d32; }
  .badge.stopped { background: #eee; color: #666; }
  .badge.paused { background: #fff3e0; color: #ef6c00; }
  .section { margin-top: 8px; padding-top: 6px; border-top: 1px solid #eee; }
  .section h2 { font-size: 12px; margin: 0 0 4px; color: #888; font-weight: 600; text-transform: uppercase; }
</style>
</head>
<body>
  <h1>MoscowFlatCollector <span id="stateBadge" class="badge stopped">остановлен</span></h1>
  <div class="buttons">
    <button id="startBtn">Start</button>
    <button id="stopBtn">Stop</button>
  </div>

  <div class="section">
    <h2>Темп</h2>
    <div class="row"><span>Интервал цель / факт</span><span id="intervalTargetActual">-</span></div>
    <div class="row"><span>Загрузка страницы (посл. / медиана)</span><span id="readyMs">-</span></div>
    <div class="row"><span>Скорость</span><span id="itemsPerHour">-</span></div>
  </div>

  <div class="section">
    <h2>Прогресс</h2>
    <div class="row"><span>Собрано</span><span id="done">-</span></div>
    <div class="row"><span>В очереди</span><span id="queued">-</span></div>
    <div class="row"><span>ETA</span><span id="eta">-</span></div>
    <div class="row"><span>Удалённые (404)</span><span id="gone">-</span></div>
    <div class="row"><span>Ошибки</span><span id="failed">-</span></div>
  </div>

  <div class="section">
    <h2>Блокировки</h2>
    <div class="row"><span>Блоков (всего / за 30 мин)</span><span id="blocks">-</span></div>
  </div>

  <div id="error"></div>
  <div id="lastEvent"></div>
  <script src="popup.js"></script>
</body>
</html>
